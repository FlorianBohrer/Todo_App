@if (clerk.user$ | async; as user) {
  <div class="flex items-center justify-end gap-3 p-4">
    <app-user-account />
    <app-device-pairing />
    <button
      class="text-xs text-danger transition hover:opacity-80"
      (click)="signOut()">
      Logout
    </button>
  </div>


  <main class="min-h-screen pt-1 w-full transition-colors duration-500 bg-bg2">
   <div class="sticky top-0 z-10 mb-0 mx-auto px-5 w-full max-w-3xl backdrop-blur-md">
     <app-header [title]="title()" [accentClass]="accentClass()"></app-header>

    <div
    class="mt-1 h-1.5 w-16 rounded-full transition-colors duration-300 sm:h-2 sm:w-24"
    [class]="accentClass()">
  </div>

<div class="mb-6 flex flex-wrap items-center gap-2">
      <button
        class="inline-flex items-center gap-2 rounded-full border px-6 py-2 text-base text-slate-200 transition hover:bg-text hover:text-slate-700"
        (click)="openCategories()"
        aria-label="Open categories">
        <lucide-icon [img]="FolderDownIcon" class="h-4 w-4"></lucide-icon>
        <span>Folders</span>
        <lucide-icon [img]="ArrowDown" class="h-4 w-4"></lucide-icon>
      </button>

      <!-- Ansicht umschalten: Liste ↔ Woche ↔ Pläne -->
      <div class="inline-flex rounded-full border border-white/10 p-1 text-sm">
        <button
          class="rounded-full px-4 py-1.5 transition"
          [class]="view() === 'list' ? 'bg-text text-slate-800' : 'text-slate-300 hover:text-white'"
          [attr.aria-pressed]="view() === 'list'"
          (click)="setView('list')">List</button>
        <button
          class="rounded-full px-4 py-1.5 transition"
          [class]="view() === 'week' ? 'bg-text text-slate-800' : 'text-slate-300 hover:text-white'"
          [attr.aria-pressed]="view() === 'week'"
          (click)="setView('week')">Week</button>
        <button
          class="rounded-full px-4 py-1.5 transition"
          [class]="view() === 'plans' ? 'bg-text text-slate-800' : 'text-slate-300 hover:text-white'"
          [attr.aria-pressed]="view() === 'plans'"
          (click)="setView('plans')">Plans</button>
      </div>
    </div>
    </div>

    @if (view() === 'plans') {
      <app-plans-view></app-plans-view>
    } @else if (view() === 'week') {
      <app-week-view></app-week-view>
    } @else {
      <app-favorite-folders></app-favorite-folders>

      <section class="mx-auto max-w-3xl rounded-2xl bg-panel2 backdrop-blur-md border border-white/10 shadow-2xl p-3 sm:p-6">
        <app-todo-stats></app-todo-stats>
        <app-todo-add></app-todo-add>
        <app-todo-filter></app-todo-filter>
        <app-todo-list></app-todo-list>
      </section>
    }

    <app-categories-overlay></app-categories-overlay>
  </main>
} @else {
  <div class="min-h-screen flex flex-col items-center justify-center gap-4 bg-bg2">
    <button
      class="rounded-full border px-6 py-3 text-slate-200 hover:bg-text hover:text-slate-700"
      (click)="signIn()">
      Sign in
    </button>

    @if (clerkFailed()) {
      <p class="text-sm text-red-400">
        The login service could not be loaded.
      </p>
      <button
        class="text-sm text-slate-400 underline transition hover:text-slate-200"
        (click)="reloadPage()">
        Reload page
      </button>
    }
  </div>
}
<app-toast-container></app-toast-container>
