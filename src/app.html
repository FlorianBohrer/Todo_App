@if (clerk.user$ | async; as user) {
  <div class="flex items-center justify-end gap-3 p-4">
    <app-user-account />
    <app-device-pairing />
    <button
      class="text-xs text-danger transition hover:opacity-80"
      (click)="signOut()">
      Logout
    </button>
  </div>


  <main class="min-h-screen w-full transition-colors duration-500 bg-bg2">
   <!-- Titel und Akzentbalken scrollen mit; nur die Leiste darunter bleibt
        stehen. Vorher klebte der ganze Block: mehr Luft über der Überschrift
        hätte dann dauerhaft ~170px Bildschirm gekostet — auf dem Telefon ein
        Viertel. So bekommt die Überschrift ihren Abstand, und oben bleibt das
        hängen, was man tatsächlich im Zugriff braucht.
        Die Breite folgt der Ansicht: Woche und Pläne sind max-w-6xl, der Titel
        stand dort schmaler als der Inhalt unter ihm. -->
   <div
     class="mx-auto w-full px-5 pt-8 sm:pt-12"
     [class]="view() === 'list' ? 'max-w-3xl' : 'max-w-6xl'">
     <app-header [title]="title()" [accentClass]="accentClass()"></app-header>

    <div
    class="mt-3 h-1.5 w-16 rounded-full transition-colors duration-300 sm:h-2 sm:w-24"
    [class]="accentClass()">
  </div>
  </div>

  <!-- Der Blur spannt über die volle Breite: vorher endete er bei max-w-3xl,
       sodass in Woche und Plänen Inhalt unblurred daneben vorbeizog. -->
  <div class="sticky top-0 z-10 mt-6 mb-6 w-full border-b border-white/5 bg-bg2/80 backdrop-blur-md">
    <div class="mx-auto w-full px-5 py-2.5"
      [class]="view() === 'list' ? 'max-w-3xl' : 'max-w-6xl'">
      <div class="flex flex-wrap items-center gap-2">
        <button
          class="inline-flex h-10 items-center gap-2 rounded-full border border-white/10 px-5 text-sm text-muted transition hover:border-white/30 hover:text-text"
          (click)="openCategories()"
          aria-label="Open categories">
          <lucide-icon [img]="FolderDownIcon" class="h-4 w-4"></lucide-icon>
          <span>Folders</span>
          <lucide-icon [img]="ArrowDown" class="h-3.5 w-3.5 opacity-60"></lucide-icon>
        </button>

        <!-- Ansicht umschalten: Liste ↔ Woche ↔ Pläne. Dieselbe gleitende Pille
             wie bei den Filtern — drei gleich breite Laschen, --tab-count sagt es.
             Gleiche Höhe wie der Folders-Knopf, damit die Leiste eine Linie hat;
             Symbole, weil man drei Ansichten am Bild schneller trifft als am Wort. -->
        <div class="filter-tabs flex h-10 gap-2 rounded-full border border-white/10 bg-bg3/60 p-1 text-sm"
          role="tablist" [style.--tab-index]="viewIndex()" [style.--tab-count]="3">
          <span class="filter-pill" aria-hidden="true"></span>

          <button type="button" role="tab"
            class="filter-tab flex w-[5.5rem] items-center justify-center gap-1.5 rounded-full sm:w-24"
            [class.is-active]="view() === 'list'"
            [attr.aria-selected]="view() === 'list'"
            title="List view (1)"
            (click)="setView('list')">
            <lucide-icon [img]="ListIcon" class="h-4 w-4 flex-none"></lucide-icon>
            <span>List</span>
          </button>
          <button type="button" role="tab"
            class="filter-tab flex w-[5.5rem] items-center justify-center gap-1.5 rounded-full sm:w-24"
            [class.is-active]="view() === 'week'"
            [attr.aria-selected]="view() === 'week'"
            title="Week view (2)"
            (click)="setView('week')">
            <lucide-icon [img]="WeekIcon" class="h-4 w-4 flex-none"></lucide-icon>
            <span>Week</span>
          </button>
          <button type="button" role="tab"
            class="filter-tab flex w-[5.5rem] items-center justify-center gap-1.5 rounded-full sm:w-24"
            [class.is-active]="view() === 'plans'"
            [attr.aria-selected]="view() === 'plans'"
            title="Plans view (3)"
            (click)="setView('plans')">
            <lucide-icon [img]="PlansIcon" class="h-4 w-4 flex-none"></lucide-icon>
            <span>Plans</span>
          </button>
        </div>

        <!-- Der Weg zu den Kürzeln, für alle, die „?" nicht raten. -->
        <button type="button"
          class="ml-auto hidden h-10 w-10 place-items-center rounded-full border border-white/10 text-sm text-muted transition hover:border-white/30 hover:text-text sm:grid"
          (click)="shortcuts.toggle()"
          title="Keyboard shortcuts (?)" aria-label="Keyboard shortcuts">?</button>
      </div>
    </div>
  </div>

    @if (view() === 'plans') {
      <app-plans-view></app-plans-view>
    } @else if (view() === 'week') {
      <app-week-view></app-week-view>
    } @else {
      <app-favorite-folders></app-favorite-folders>

      <section class="mx-auto max-w-3xl rounded-2xl bg-panel2 backdrop-blur-md border border-white/10 shadow-2xl p-3 sm:p-6">
        <app-todo-stats></app-todo-stats>

        <app-focus-panel></app-focus-panel>

        <app-todo-filter></app-todo-filter>
        <app-todo-add></app-todo-add>
        <app-todo-list></app-todo-list>
      </section>
    }

    <app-categories-overlay></app-categories-overlay>
    <app-shortcuts-overlay #shortcuts></app-shortcuts-overlay>
  </main>
} @else {
  <div class="min-h-screen flex flex-col items-center justify-center gap-4 bg-bg2">
    <button
      class="rounded-full border px-6 py-3 text-slate-200 hover:bg-text hover:text-slate-700"
      (click)="signIn()">
      Sign in
    </button>

    @if (clerkFailed()) {
      <p class="text-sm text-red-400">
        The login service could not be loaded.
      </p>
      <button
        class="text-sm text-slate-400 underline transition hover:text-slate-200"
        (click)="reloadPage()">
        Reload page
      </button>
    }
  </div>
}
<app-toast-container></app-toast-container>
