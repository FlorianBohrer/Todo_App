@if (shown(); as up) {
  <!-- role="status": angesagt wird es, aber es nimmt niemandem den Fokus. -->
  <div class="level-up" role="status" (click)="dismiss()">
    <div class="level-up__rays" aria-hidden="true"></div>
    <div class="level-up__wave" aria-hidden="true"></div>

    <div class="level-up__card">
      <p class="level-up__kicker">{{ kicker() }}</p>
      <p class="level-up__number"><span class="sr-only">Level </span>{{ up.to.level }}</p>
      <p class="level-up__title">
        @if (up.newTitle) {
          <span class="level-up__new">New title</span>
        }
        {{ up.to.title }}
      </p>
      <p class="level-up__hint">{{ up.to.stepSize }} XP to level {{ up.to.level + 1 }}</p>
    </div>
  </div>
}
