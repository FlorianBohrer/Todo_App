<section class="mt-4 py-2 sm:p-0">
  <!-- Angeklickte Hauptaufgabe: das Feld sagt, wohin das Getippte geht.
       Ohne diese Zeile waere die Auswahl eine unsichtbare Voreinstellung —
       man legt ein Todo an und findet es woanders wieder. -->
  @if (parent()) {
    <div class="mb-2 flex items-center gap-2 rounded-lg bg-fill px-3 py-1.5 text-xs text-muted">
      <lucide-icon [img]="SubIcon" class="h-3.5 w-3.5 flex-none text-brand-2"></lucide-icon>
      <span class="flex-none">Step of</span>
      <span class="min-w-0 flex-1 truncate text-text">{{ parentTitle() }}</span>
      <button type="button"
        class="grid h-5 w-5 flex-none place-items-center rounded text-subtle transition hover:bg-fill-strong hover:text-text"
        (click)="clearParent()" aria-label="Add to the list instead">
        <lucide-icon [img]="ClearIcon" class="h-3.5 w-3.5"></lucide-icon>
      </button>
    </div>
  }

 <div class="flex items-end gap-3">
  <!-- Rund wie der Knopf daneben: beides ist ein Bedienelement, und zwei
       verschiedene Ecken in einer Zeile lesen sich wie zwei Bausätze.

       „What's next?" statt „Add a todo…": das Feld fragt, statt eine
       Bedienanleitung zu sein. Dass man hier etwas eintippt, sagt das Feld
       schon dadurch, dass es eins ist. -->
  <!-- Die Fläche gehört jetzt dem Rahmen um Chip und Textfeld, nicht dem
       Textfeld allein: der Chip steht IM Feld, vor dem Text, so wie das
       Präfix vorher davorstand. Der Fokusring folgt mit focus-within. -->
  <!-- min-w-0: sonst zaehlt die Eigenbreite des Textfelds (~20 Zeichen) als
       Mindestbreite, und mit einem Chip davor schob das Feld den Add-Knopf
       auf dem Telefon ueber den Rand. -->
  <div
    class="todo-add-field flex min-h-11 min-w-0 flex-1 items-start gap-2 rounded-3xl bg-bg2 px-5 py-3"
    (click)="newTodoField.focus()">
    @for (current of tokens(); track current) {
      <button
        type="button"
        class="token-chip flex h-6 flex-none items-center gap-0.5 rounded-md pl-1 pr-1"
        [class]="tokenClass(current)"
        (click)="$event.stopPropagation(); clearToken(current)"
        [attr.aria-label]="tokenDescription(current) + ', remove'"
        [title]="tokenDescription(current) + ' · remove (Backspace at the start)'">
        <lucide-icon [img]="tokenIcon(current)" class="h-4 w-4" aria-hidden="true"></lucide-icon>@if (tokenText(current); as t) {<span class="text-2xs font-medium tabular-nums">{{ t }}</span>}
        <lucide-icon [img]="ClearIcon" class="h-3 w-3 opacity-60" aria-hidden="true"></lucide-icon>
      </button>
    }

    <textarea
      #newTodoField
      appAutosize
      rows="1"
      class="min-w-0 flex-1 resize-none overflow-hidden bg-transparent p-0 text-text placeholder:text-subtle"
      [placeholder]="parent() ? 'Add a step…' : 'What’s next?'"
      [ngModel]="newTitle"
      (ngModelChange)="onInput($event)"
      (keydown.enter)="$event.preventDefault(); addTodo()"
      (keydown.escape)="onEscape()"
      (keydown.backspace)="onBackspace($event)"
      [attr.aria-label]="fieldLabel()"
    ></textarea>

    <!-- Termin. Ohne Datum nur ein leises Symbol am Ende des Felds; mit
         Datum steht es als Chip da, wie die Präfixe vorn. -->
    <button
      type="button"
      cdkOverlayOrigin #dateTrigger="cdkOverlayOrigin"
      class="todo-add-date -my-1 -mr-2 flex h-8 flex-none items-center gap-1 self-start rounded-full px-2 text-xs transition"
      [class.is-set]="date() !== null"
      (click)="$event.stopPropagation(); dateOpen.set(!dateOpen())"
      aria-haspopup="dialog"
      [attr.aria-expanded]="dateOpen()"
      [attr.aria-label]="date() === null ? 'Plan for a day' : 'Planned for ' + dateText() + ', change'"
      [title]="date() === null ? 'Plan for a day' : 'Planned for ' + dateText()">
      <lucide-icon [img]="DateIcon" class="h-4 w-4" aria-hidden="true"></lucide-icon>
      @if (date() !== null) {
        <span>{{ dateText() }}</span>
      }
    </button>

    <ng-template
      cdkConnectedOverlay
      [cdkConnectedOverlayOrigin]="dateTrigger"
      [cdkConnectedOverlayOpen]="dateOpen()"
      [cdkConnectedOverlayPositions]="datePositions"
      [cdkConnectedOverlayPush]="true"
      [cdkConnectedOverlayViewportMargin]="16"
      [cdkConnectedOverlayHasBackdrop]="true"
      cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
      (backdropClick)="dateOpen.set(false)"
      (detach)="dateOpen.set(false)"
      (overlayKeydown)="$event.key === 'Escape' && dateOpen.set(false)">
      <div class="popover w-[min(18rem,calc(100vw-2rem))] p-2.5" role="dialog" aria-label="Plan the new todo for a day">
        <app-date-picker [value]="date()" [autofocus]="true" (picked)="setDate($event)" />
      </div>
    </ng-template>
  </div>

  <button
    type="button"
    class="btn btn-primary h-11 flex-none self-end px-5"
    title="New todo (n)"
    (click)="addTodo()"
  >
    Add
  </button>
</div>
</section>
