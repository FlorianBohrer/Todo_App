  <div class="mt-6 mb-3">
  <div class="flex h-11 w-full items-center gap-3 rounded-full bg-bg3 px-4
              ring-1 ring-white/10 transition focus-within:ring-2 focus-within:ring-indigo-500">
    <lucide-icon [img]="SearchIcon" class="h-4 w-4 flex-none text-muted" aria-hidden="true"></lucide-icon>
    <input #todoSearch type="text" placeholder="Search todos…"
      class="min-w-0 flex-1 bg-transparent text-text outline-none placeholder:text-muted"
      [value]="searchTerm()"
      (input)="searchTerm.set(todoSearch.value)"
      (keydown.escape)="clearSearch(); todoSearch.value = ''"
      aria-label="Search todos" />
    @if (searchTerm()) {
      <button type="button"
        class="grid h-7 w-7 flex-none place-items-center rounded-md text-muted transition hover:bg-white/5 hover:text-text"
        (click)="clearSearch(); todoSearch.value = ''" aria-label="Clear search">✕</button>
    } @else {
      <!-- Ein Kürzel, das niemand kennt, nützt nichts — also zeigt das Feld es
           selbst. Am Handy ausgeblendet, dort gibt es keine Taste dafür. -->
      <kbd class="hidden flex-none rounded border border-white/15 px-1.5 py-0.5 font-mono text-[11px] text-subtle sm:block"
        aria-hidden="true">/</kbd>
    }
  </div>
</div>
  
  <!-- Eine Pille, die wandert — statt vier Knöpfe, die unabhängig aufleuchten.
       Der Index treibt sie; vier gleich breite Laschen (flex-1) machen die
       Rechnung ohne Messen im DOM möglich. -->
  <section class="filter-tabs relative flex gap-2 mt-6 mb-4 rounded-full bg-bg3 p-1"
    role="tablist" [style.--tab-index]="tabIndex()">
    <span class="filter-pill" aria-hidden="true"></span>

    <button type="button" role="tab" class="filter-tab flex-1 btn rounded-full"
      [class.is-active]="filter() === 'active'"
      [attr.aria-selected]="filter() === 'active'"
      (click)="filter.set('active')">Active</button>
    <button type="button" role="tab" class="filter-tab flex-1 btn rounded-full"
      [class.is-active]="filter() === 'completed'"
      [attr.aria-selected]="filter() === 'completed'"
      (click)="filter.set('completed')">Done</button>
    <button type="button" role="tab" class="filter-tab flex-1 btn rounded-full"
      [class.is-active]="filter() === 'favorites'"
      [attr.aria-selected]="filter() === 'favorites'"
      (click)="filter.set('favorites')">Favorites</button>
    <button type="button" role="tab" class="filter-tab flex-1 btn rounded-full"
      [class.is-active]="filter() === 'all'"
      [attr.aria-selected]="filter() === 'all'"
      (click)="filter.set('all')">All</button>
  </section>
