<!-- Die Leiste: läuft etwas, Punkt, hochzählende Zeit, Titel und Pause; sonst
     „Track". Beides öffnet die Auswahl an derselben Stelle. -->
<div class="track-bar" cdkOverlayOrigin #origin="cdkOverlayOrigin">
  @if (active(); as running) {
    <div class="track-pill sheet-in" [class.is-paused]="running.paused" [class.is-open]="open()">
      <button
        type="button"
        class="track-pill__main"
        [title]="label()"
        [attr.aria-label]="label()"
        [attr.aria-expanded]="open()"
        aria-haspopup="dialog"
        (click)="toggle()">
        <span class="track-dot" [class.is-paused]="running.paused" aria-hidden="true"></span>
        <span class="track-pill__clock" aria-hidden="true">{{ clock() }}</span>
        <span class="track-pill__title" aria-hidden="true">{{ title() }}</span>
      </button>
      <!-- Pausieren gleich in der Leiste: der häufigste Handgriff, ein Tipp.
           Nur bei einer Erfassung von hier — einen Block in Flow steuert Flow. -->
      @if (running.tracked) {
        <button
          type="button"
          class="track-pill__toggle"
          [disabled]="busy()"
          [attr.aria-label]="running.paused ? 'Resume tracking' : 'Pause tracking'"
          [title]="running.paused ? 'Resume' : 'Pause'"
          (click)="pauseOrResume($event)">
          <lucide-icon [img]="running.paused ? PlayIcon : PauseIcon" class="h-3.5 w-3.5"></lucide-icon>
        </button>
      }
    </div>
  } @else {
    <button
      type="button"
      class="track-start"
      [class.is-open]="open()"
      [attr.aria-expanded]="open()"
      aria-haspopup="dialog"
      title="Track time on a task"
      (click)="toggle()">
      <lucide-icon [img]="PlayIcon" class="h-3.5 w-3.5"></lucide-icon>
      <span>Track</span>
    </button>
  }
</div>

<!-- Die Auswahl wird erst geladen, wenn man sie zum ersten Mal öffnet: die
     Leiste steht auf jeder Seite, das Fenster braucht kaum jemand ständig. -->
@if (open()) {
  @defer (on immediate) {
    <app-track-picker [origin]="origin" [clock]="clock()" [title]="title()" (closed)="close()" />
  }
}
