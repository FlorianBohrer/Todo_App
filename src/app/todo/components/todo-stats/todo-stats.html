<!-- Kein Kasten um diesen Block: er steht auf derselben Fläche wie die Liste
     darunter. Eine Begrüßung, die sich eine eigene Fläche nimmt, ist keine
     ruhige. -->
<section class="flex items-start justify-between gap-5 px-1 pt-1 pb-4" aria-label="Today">
  <div class="min-w-0 flex-1">
    <h2 class="text-2xl/[1.15] font-semibold tracking-[-0.02em] text-text sm:text-3xl/[1.1]">
      {{ greeting() }}<span [class]="accentClass()">.</span>
    </h2>

    <p class="mt-1.5 text-sm/[1.55] tabular-nums" [class]="todayLineClass()">{{ todayLine() }}</p>

    @if (scopeName(); as scope) {
      <!-- Welcher Ausschnitt gemeint ist, wenn es nicht alle sind. Der Ring
           daneben spricht über genau diesen Ordner, und ohne diese Zeile
           müsste man sich das aus der Leiste darüber zusammensuchen. -->
      <p class="mt-1 text-xs tabular-nums text-subtle">
        in <span [class]="accentClass()">{{ scope }}</span> ·
        {{ stats().completed }} of {{ stats().total }} done
      </p>
    }
  </div>

  @if (stats().total > 0) {
    <app-progress-ring
      class="mt-0.5 flex-none"
      [class]="accentClass()"
      [size]="56"
      [thickness]="5"
      [completed]="stats().completed"
      [total]="stats().total" />
  }
</section>
