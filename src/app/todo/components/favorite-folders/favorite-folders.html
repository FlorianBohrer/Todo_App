@if (tileCount() > 0) {
  <section class="mx-auto mb-5 w-full max-w-3xl" aria-label="Favorite folders">
    <!-- Ab sm nebeneinander, bei vier Ordnern eine Reihe mit vier. Auf dem
         Telefon zwei Spalten: untereinander standen fuenf Kacheln je 80px, und
         die eigentliche Liste begann erst unter dem Bildschirmrand. Unter
         360px bleibt es bei einer Spalte, dort passt „2 of 3 done" sonst
         nicht mehr neben den Ring.

         Was hier WEGGEFALLEN ist, und warum: der Verlauf hinter dem Symbol,
         das Symbol im abgerundeten Kästchen, shadow-lg samt Anheben beim
         Überfahren, und die Prozentzahl neben dem Balken.

         Zusammen waren das vier Dinge, die alle dasselbe sagten — dass es
         sich hier um eine anklickbare Kachel handelt — und eins, das der
         Balken schon sagte. Was bleibt, ist die Farbe des Ordners und sein
         Fortschritt.

         Die Farbe steht jetzt nur noch im Ring. Sie war dreimal da — als
         getönte Fläche, als Rand und als Schrift —, und fünf Kacheln in fünf
         Tönen lasen sich wie ein Regenbogen über der Liste, lauter als die
         Liste selbst. Die Schrift ist wieder Schrift; `currentColor` am Knopf
         bleibt die Ordnerfarbe, damit Ring und Erfolgsring sie finden. -->
    <!-- Auf dem Telefon eine Reihe zum Wischen statt eines Rasters
         (favorite-folders.scss, .favorite-strip): drei Reihen Kacheln standen
         dort vor der ersten Aufgabe. -->
    <div
      class="favorite-strip grid grid-cols-1 gap-2.5 min-[360px]:grid-cols-2"
      [class]="tileCount() === 4 ? 'sm:grid-cols-4' : 'sm:grid-cols-3'">

      <!-- Virtueller Favoriten-Ordner: Fortschritt aller favorisierten Todos -->
      @if (favoriteProgress().total > 0) {
        <button
          type="button"
          class="favorite-tile folder-card flex items-center gap-2.5 rounded-3xl border border-line bg-panel1 p-3 text-left text-amber-300 transition duration-200 hover:border-line-strong sm:gap-3 sm:p-4"
          [class.favorite-tile--wide]="tileCount() % 2 === 1"
          [class.ring-2]="favoritesActive()"
          [class.ring-highlight2]="favoritesActive()"
          [class.celebrate-fav]="isCelebrating(FAVORITE_TODOS_KEY)"
          [attr.aria-pressed]="favoritesActive()"
          (click)="selectFavorites()">

          <!-- Der Stern in der Mitte des Rings, nicht vor dem Namen: dort
               nahm er „Favorites" so viel Breite, dass das Wort mitten im
               Wort umbrach. Die Ringmitte ist ohnehin leer. -->
          <app-progress-ring
            class="flex-none"
            arcClass="folder-progress"
            [trackOpacity]="0.3"
            [size]="40"
            [thickness]="4"
            [check]="false"
            [completed]="favoriteProgress().completed"
            [total]="favoriteProgress().total">
            <lucide-icon [img]="StarIcon" class="fav-star h-3.5 w-3.5 fill-amber-300 text-amber-300"></lucide-icon>
          </app-progress-ring>

          <span class="min-w-0 flex-1">
            <span class="folder-name block font-semibold text-text">Favorites</span>
            <span class="mt-0.5 block whitespace-nowrap text-xs tabular-nums text-subtle">
              {{ favoriteProgress().completed }} of {{ favoriteProgress().total }} done
            </span>
          </span>
        </button>
      }

      @for (label of favorites(); track label.id) {
        <button
          type="button"
          class="folder-card flex items-center gap-2.5 rounded-3xl border border-line bg-panel1 p-3 pr-6 text-left transition duration-200 hover:border-line-strong sm:gap-3 sm:p-4 sm:pr-7"
          [class]="textClass(label.color)"
          [class.ring-2]="activeLabelId() === label.id"
          [class.ring-highlight2]="activeLabelId() === label.id"
          [class.celebrate]="isCelebrating(label.id)"
          [attr.aria-pressed]="activeLabelId() === label.id"
          (click)="select(label.id)">

          <!-- Der Ring IST die Farb-Identität des Ordners. Deshalb braucht es
               daneben kein zweites Symbol in einem farbigen Kästchen mehr:
               `currentColor` holt sich die Farbe von der Zeile. -->
          <app-progress-ring
            class="flex-none"
            arcClass="folder-progress"
            [trackOpacity]="0.3"
            [size]="40"
            [thickness]="4"
            [completed]="progress(label.id).completed"
            [total]="progress(label.id).total" />

          <span class="min-w-0 flex-1">
            <!-- Prefix als Chip, Name darunter über zwei Zeilen: einzeilig
                 abgeschnitten liest sich "projekt: Bozen Live Impact Twin"
                 wie ein Fehler statt wie ein langer Name. -->
            @if (nameParts(label.name).prefix; as prefix) {
              <span [class]="'folder-chip ' + chipClass(label.color)">{{ prefix }}</span>
            }
            <span class="folder-name block font-semibold text-text">
              {{ nameParts(label.name).name }}
            </span>
            <span class="mt-0.5 block whitespace-nowrap text-xs tabular-nums text-subtle">
              {{ progress(label.id).completed }} of {{ progress(label.id).total }} done
            </span>
          </span>

          <!-- Der Stern kommt erst beim Überfahren.
               Jede Karte in dieser Reihe IST ein Favorit — das ist der Grund,
               warum sie hier steht. Ein Stern auf jeder sagt also nichts, und
               er nahm dem Namen die Breite: „2 of 3 done" brach um, und
               „Favorites" wurde abgeschnitten. Als Handlung bleibt er
               erreichbar, wie die Knöpfe an den Listenzeilen auch. -->
          <span
            class="fav-toggle absolute right-2 top-2 rounded-full p-1 text-amber-400/80 transition hover:text-amber-300"
            role="button"
            tabindex="0"
            aria-label="Remove folder from favorites"
            (click)="toggleFavorite(label.id, $event)"
            (keydown.enter)="toggleFavorite(label.id, $event)">
            <lucide-icon [img]="StarIcon" class="h-4 w-4 fill-amber-400/80"></lucide-icon>
          </span>
        </button>
      }
    </div>
  </section>
}
