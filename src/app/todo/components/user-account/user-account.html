@if (account$ | async; as account) {
  <!-- Nur das Bild.

       Vorher stand hier eine Karte mit Rahmen, Schatten, Name, E-Mail und der
       rohen Clerk-ID. Das war das auffaelligste Element der Seite fuer die
       Funktion, die man am seltensten braucht — und die ID musste ohnehin nie
       jemand ablesen. Wer wissen will, als wer er angemeldet ist, faehrt
       darueber; alles andere ist Dauerrauschen. -->
  <img
    [src]="account.avatarUrl"
    [alt]="'Signed in as ' + account.username"
    [title]="account.username + ' · ' + account.email"
    referrerpolicy="no-referrer"
    class="h-7 w-7 shrink-0 rounded-full object-cover opacity-80 transition hover:opacity-100"
  />
}
